[package]
name = "ddc_probe"
version = "0.1.0"
edition = "2024"
description = "Read-only DDC/CI probe of Titan Army P275MV PLUS monitors via the Windows Monitor Configuration API (Dxva2)"
publish = false

# Stand-alone crate: not part of the main titan-control build.
[workspace]

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
]
